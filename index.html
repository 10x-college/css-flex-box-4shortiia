<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Flex-Box</title>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="nav-menu">
          <img src="./assets/Group 3.svg" alt="Group" />
        </div>
        <nav class="nav-links">
          <div class="nav-item active">
            <img src="./assets/Home icon.svg" alt="home" />
          </div>
          <div class="nav-item">
            <img src="./assets/layers 1.svg" alt="layer 1" />
          </div>
          <div class="nav-item">
            <img src="./assets/layers 2.svg" alt="layer 2" />
          </div>
          <div class="nav-item">
            <img src="./assets/layers 3.svg" alt="layer 3" />
          </div>
          <div class="nav-item">
            <img src="./assets/layers 4.svg" alt="layer 4" />
          </div>
        </nav>
      </aside>

      <main class="main-content">
        <div class="top-bar">Dashboard da @say.valente</div>

        <div class="grid-container">
          <div class="card small"></div>
          <div class="card small"></div>
          <div class="card small"></div>
          <div class="card wide"></div>
          <div class="card medium"></div>
          <div class="card medium"></div>
        </div>
      </main>

      <aside class="right-panel">
        <div class="stacked-cards">
          <div class="color-card green"></div>
          <div class="color-card orange"></div>
          <div class="color-card purple"></div>
        </div>
        <div class="card tall"></div>
      </aside>
    </div>
  </body>
</html>
